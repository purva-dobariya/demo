# ONDC website -- nginx performance snippet. Goes in the http {} context:
#     sudo cp deploy/nginx/ondc-perf.conf /etc/nginx/conf.d/    (conf.d is included by default)
# Then in the site's server {} block (see README.md next to this file):
#   1. replace the existing  add_header Cache-Control "no-store, ..."  and  add_header Pragma  lines with
#          add_header Cache-Control $ondc_cache_control always;
#   2. change  listen 443 ssl;  to  listen 443 ssl http2;
#
# Why a map instead of location blocks: nginx's add_header does not inherit, so a
# Cache-Control add_header inside a location {} would silently drop the site's
# X-Frame-Options / CSP / Referrer-Policy headers for those files. One
# server-level add_header keyed on the response type keeps them all.

map $sent_http_content_type $ondc_cache_control {
    default                                            "public, max-age=300, must-revalidate";
    ~^text/html                                        "public, max-age=300, must-revalidate";
    ~^(text/css|application/javascript|text/javascript|application/json)
                                                       "public, max-age=86400, must-revalidate";
    ~^(image/|font/|application/font|application/pdf|application/octet-stream)
                                                       "public, max-age=31536000, immutable";
}

# Text assets were served uncompressed (only text/html was gzipped): a category
# page's 225 KB of CSS becomes ~40 KB with this.
gzip              on;
gzip_vary         on;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types        text/css text/plain text/javascript application/javascript application/json
                  application/xml image/svg+xml font/ttf font/otf application/octet-stream;
